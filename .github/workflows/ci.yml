name: CI

# From govengers/standards templates/library.
#
# Every push and pull request: lint, unit tests of changed and affected packages (TST-014), the end-to-end suite
# unless it is unchanged (TST-015), vulncheck, and README badges from main. Nightly: every test, uncached, so a
# flaky test cannot hide in the cache for longer than a day; a v* tag runs everything uncached too. The newest
# stable release then mirrors its docs/wiki to the GitHub wiki.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

# A new push to a pull request cancels its older run; pushes to main and tags always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  library:
    uses: govengers/.github/.github/workflows/go-library.yml@v1
    with:
      e2e: true
      full: ${{ github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write # the badges job pushes test and coverage badges to the badges branch

  wiki:
    name: mirror docs/wiki to the GitHub wiki
    needs: library
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    concurrency:
      group: wiki
      cancel-in-progress: false
    permissions:
      contents: write # push to the repository's wiki with the workflow token
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags, to tell whether this tag is the newest release

      # Only the newest stable release: a backport or a pre-release must not put older docs on the wiki.
      - name: publish docs/wiki of this release
        env:
          TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }} # the checkout's credentials do not reach the wiki clone
        run: |
          newest="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          if [ "$newest" != "$TAG" ]; then
            echo "$TAG is not the newest stable release ($newest); the wiki stays as it is"
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          .github/scripts/publish-wiki.sh "$TAG"
